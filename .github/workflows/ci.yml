name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run moot: cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-shear
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # Unused or misplaced dependencies, and .rs files no module declares.
      - run: cargo shear
      - run: cargo nextest run --workspace --locked
