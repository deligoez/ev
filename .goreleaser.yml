version: 2

project_name: ev

builds:
  - id: ev
    builder: rust
    binary: ev
    flags:
      - --release
      - --locked
      - -p=ev-cli
    targets:
      - x86_64-apple-darwin
      - aarch64-apple-darwin
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu

archives:
  - name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macOS
      {{- else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    formats:
      - tar.gz

checksum:
  name_template: checksums.txt

brews:
  - repository:
      owner: deligoez
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    commit_author:
      name: goreleaser
      email: goreleaser@users.noreply.github.com
    homepage: https://github.com/deligoez/ev
    description: "Agent-first home inventory"
    license: "MIT"
    install: |
      bin.install "ev"
    test: |
      assert_match "ev #{version}", shell_output("#{bin}/ev --version")

changelog:
  sort: asc
