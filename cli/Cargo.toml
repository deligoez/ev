[package]
name = "ev-cli"
version = "0.1.1"
edition = "2024"

[[bin]]
name = "ev"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
ev-core = { version = "0.1.0", path = "../core" }
serde_json = "1.0.151"

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"
