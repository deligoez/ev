[package]
name = "ev-cli"
version = "0.14.0"
edition = "2024"
description = "Agent-first home inventory"
license = "MIT"
repository = "https://github.com/deligoez/ev"
homepage = "https://github.com/deligoez/ev"
publish = false

[package.metadata.dist]
# Not on crates.io (publish = false), but released as binaries.
dist = true
# The Homebrew formula keeps the name it had: `brew install deligoez/tap/ev`.
formula = "ev"

[[bin]]
name = "ev"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
ev-core = { path = "../core" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
serde_json = "1.0.151"
sys-locale = "0.3.2"

[dev-dependencies]
assert_cmd = "2.2.2"
ev-core = { path = "../core" }
tempfile = "3.27.0"
